    "DR Congo":"Congo RD","Uzbekistan":"Ouzbékistan","Colombia":"Colombie",
    "England":"Angleterre","Croatia":"Croatie","Panama":"Panama",
    "Brazil":"Brésil","Morocco":"Maroc","Haiti":"Haïti","Scotland":"Écosse",
    "Australia":"Australie","Turkey":"Türkiye","Ivory Coast":"Côte d'Ivoire",
    "Ecuador":"Équateur","Japan":"Japon","Tunisia":"Tunisie","Uruguay":"Uruguay",
    "Switzerland":"Suisse","Canada":"Canada","Qatar":"Qatar","Ghana":"Ghana",
    "Paraguay":"Paraguay",
  };
  return MAP[name] || name;
}

async function fetchMatchSummary(match, liveData) {
  const desc = match.group
    ? `Groupe ${match.group} — ${match.date} ${match.time} heure française`
    : `${match.phase} — ${match.date} ${match.time} heure française`;
  const scoreInfo = liveData ? `Score final : ${liveData.homeScore} - ${liveData.awayScore}` : "";
  const prompt = `Tu es un journaliste sportif expert Coupe du Monde FIFA 2026. Donne-moi les faits marquants du match :
Match : ${match.home} vs ${match.away} — ${desc}
Stade : ${match.venue}, ${match.city}
${scoreInfo}
Réponds UNIQUEMENT en JSON valide sans markdown :
{"score":"X - X","buteurs":["Nom (XX')"],"cartons_rouges":["Nom (XX')"],"fait_marquant":"Résumé 3-5 phrases.","homme_du_match":"Prénom Nom (pays)","affluence":"XX XXX spectateurs","found":true}
Si introuvable : {"found":false}`;
  const res = await fetch("/api/summary", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({matchId:match.id, prompt}),
  });
  const data = await res.json();
  if (data.score || data.found===false) return data;
  return null;
}

function LiveBadge() {
  const [on,setOn] = useState(true);
  useEffect(()=>{ const t=setInterval(()=>setOn(x=>!x),800); return()=>clearInterval(t); },[]);
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:5,background:"rgba(239,68,68,.15)",border:"1px solid rgba(239,68,68,.4)",borderRadius:20,padding:"2px 10px",fontSize:11,color:"#f87171",fontWeight:700,letterSpacing:1}}>
      <span style={{width:7,height:7,borderRadius:"50%",background:on?"#ef4444":"transparent",transition:"background .2s"}}/>LIVE
    </span>
  );
}

function MatchCard({match,onGetSummary,summaryData,loadingId,liveScore}) {
  const played=isPlayed(match),today=isToday(match);
  const loading=loadingId===match.id;
  const ok=summaryData&&summaryData.found!==false;
  const pc=match.phase?PHASE_COLORS[match.phase]:null;
const isLiveNow=liveScore&&(liveScore.status==="IN_PLAY"||liveScore.status==="PAUSED")&&isToday(match);
  const isFinished=liveScore&&liveScore.status==="FINISHED"&&(isPlayed(match)||isToday(match));
  const hasLiveScore=liveScore&&liveScore.homeScore!==null&&liveScore.homeScore!==undefined&&(isPlayed(match)||isToday(match));
  const scoreDisplay=ok?summaryData.score:hasLiveScore?`${liveScore.homeScore} - ${liveScore.awayScore}`:null;

  return (
    <div style={{
      background:match.phase==="Finale"?"linear-gradient(135deg,rgba(22,163,74,.12),rgba(5,150,105,.06))":match.france?"linear-gradient(135deg,rgba(0,35,149,.18),rgba(237,41,57,.08))":played?"rgba(255,255,255,.05)":"rgba(255,255,255,.03)",
      border:`1px solid ${match.phase==="Finale"?"rgba(52,211,153,.35)":match.france?"rgba(96,165,250,.4)":played?"rgba(255,255,255,.1)":"rgba(255,255,255,.05)"}`,
      borderLeft:`4px solid ${pc||(match.france?"#3b82f6":played?"#22c55e":"#334155")}`,
      borderRadius:12,padding:"12px 14px",marginBottom:8,
    }}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:4}}>
        <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
          {match.group&&<span style={{fontSize:11,fontWeight:700,background:"rgba(200,160,32,.15)",color:"#f5d060",padding:"2px 7px",borderRadius:4}}>Gr. {match.group}</span>}
          {match.phase&&<span style={{fontSize:11,fontWeight:700,background:`${pc}22`,color:pc,padding:"2px 7px",borderRadius:4}}>{match.phase}</span>}
          {isFinished&&<span style={{fontSize:10,fontWeight:700,background:"rgba(34,197,94,.15)",color:"#4ade80",padding:"2px 7px",borderRadius:4}}>✓ TERMINÉ</span>}
          {isLiveNow&&<><LiveBadge/>{liveScore.minute&&<span style={{fontSize:11,color:"#f87171",fontWeight:700}}>{liveScore.minute}'</span>}</>}
          {!isFinished&&!isLiveNow&&played&&<span style={{fontSize:10,fontWeight:700,background:"rgba(34,197,94,.15)",color:"#4ade80",padding:"2px 7px",borderRadius:4}}>✓ TERMINÉ</span>}
          {!liveScore&&today&&<LiveBadge/>}
          {match.france&&<span style={{fontSize:10,color:"#93c5fd"}}>🇫🇷</span>}
        </div>
        <span style={{fontSize:12,fontWeight:700,color:isLiveNow?"#f87171":"#60a5fa"}}>{match.time}</span>
      </div>
      {scoreDisplay?(
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <span style={{fontSize:18}}>{f(match.home)}</span>
          <span style={{fontSize:14,fontWeight:700,color:"#e2e8f0",flex:1}}>{match.home}</span>
          <span style={{fontSize:22,fontWeight:900,color:isLiveNow?"#f87171":"#f5d060",background:isLiveNow?"rgba(239,68,68,.12)":"rgba(200,160,32,.12)",padding:"2px 14px",borderRadius:8,letterSpacing:2}}>{scoreDisplay}</span>
          <span style={{fontSize:14,fontWeight:700,color:"#e2e8f0",flex:1,textAlign:"right"}}>{match.away}</span>
          <span style={{fontSize:18}}>{f(match.away)}</span>
        </div>
      ):(
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <span style={{fontSize:18}}>{f(match.home)}</span>
          <span style={{fontSize:14,fontWeight:700,color:"#e2e8f0",flex:1}}>{match.home}</span>
          <span style={{fontSize:11,color:"#475569",padding:"2px 10px"}}>VS</span>
          <span style={{fontSize:14,fontWeight:700,color:"#e2e8f0",flex:1,textAlign:"right"}}>{match.away}</span>
          <span style={{fontSize:18}}>{f(match.away)}</span>
        </div>
      )}
      <div style={{fontSize:11,color:"#64748b",marginBottom:(played||ok)?10:0}}>📍 {match.venue} · {match.city}</div>
      {ok&&(
        <div style={{borderTop:"1px solid rgba(255,255,255,.06)",paddingTop:10}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10}}>
            {summaryData.buteurs?.length>0&&(
              <div style={{background:"rgba(255,255,255,.04)",borderRadius:8,padding:"6px 10px",flex:1,minWidth:120}}>
                <div style={{fontSize:10,color:"#64748b",letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>⚽ Buteurs</div>
                {summaryData.buteurs.map((b,i)=><div key={i} style={{fontSize:12,color:"#e2e8f0"}}>{b}</div>)}
              </div>
            )}
            {summaryData.cartons_rouges?.length>0&&(
              <div style={{background:"rgba(239,68,68,.06)",borderRadius:8,padding:"6px 10px",flex:1,minWidth:120}}>
                <div style={{fontSize:10,color:"#64748b",letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>🟥 Cartons rouges</div>
                {summaryData.cartons_rouges.map((c,i)=><div key={i} style={{fontSize:12,color:"#fca5a5"}}>{c}</div>)}
              </div>
            )}
            {summaryData.homme_du_match&&(
              <div style={{background:"rgba(234,179,8,.08)",borderRadius:8,padding:"6px 10px",minWidth:100}}>
                <div style={{fontSize:10,color:"#64748b",letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>⭐ Homme du match</div>
                <div style={{fontSize:12,color:"#fde047",fontWeight:700}}>{summaryData.homme_du_match}</div>
              </div>
            )}
          </div>
          {summaryData.fait_marquant&&(
            <div style={{background:"rgba(255,255,255,.03)",borderRadius:8,padding:"10px 12px",fontSize:13,color:"#cbd5e1",lineHeight:1.7,fontStyle:"italic",borderLeft:"3px solid rgba(200,160,32,.4)"}}>
              {summaryData.fait_marquant}
            </div>
          )}
          {summaryData.affluence&&<div style={{marginTop:6,fontSize:11,color:"#475569"}}>🏟 {summaryData.affluence}</div>}
        </div>
      )}
      {(played||isFinished)&&!ok&&(
        <button onClick={()=>onGetSummary(match)} disabled={loading} style={{marginTop:8,width:"100%",padding:"8px 14px",borderRadius:8,border:"1px solid rgba(200,160,32,.3)",background:loading?"rgba(200,160,32,.05)":"rgba(200,160,32,.1)",color:loading?"#64748b":"#f5d060",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          {loading?<><span style={{display:"inline-block",animation:"spin 1s linear infinite"}}>⏳</span>Génération…</>:<>✨ Obtenir le résumé IA</>}
        </button>
      )}
    </div>
  );
}function App() {
  const [filter,setFilter]     = useState("all");
  const [groupF,setGroupF]     = useState(null);
  const [summaries,setSummaries] = useState({});
  const [loadingId,setLoadingId] = useState(null);
  const [lastSync,setLastSync]   = useState(new Date());
  const [autoLoad,setAutoLoad]   = useState(false);
  const [liveScores,setLiveScores] = useState({});
  const [liveStatus,setLiveStatus] = useState("loading");
  const [,setTick] = useState(0);

  const refreshScores = useCallback(async()=>{
    setLiveStatus("loading");
    const data = await fetchLiveScores();
    if(data&&data.matches){
      const scoreMap={};
      data.matches.forEach(m=>{
        const homeNorm=normalizeName(m.homeTeam);
        const awayNorm=normalizeName(m.awayTeam);
        const found=MATCHES.find(local=>
          (local.home===homeNorm&&local.away===awayNorm)||
          (local.home===awayNorm&&local.away===homeNorm)
        );
        if(found) scoreMap[found.id]={status:m.status,homeScore:m.homeScore,awayScore:m.awayScore,minute:m.minute,winner:m.winner};
      });
      if(Object.keys(scoreMap).length>0) setLiveScores(scoreMap);
      setLastSync(new Date());
      setLiveStatus("ok");
    } else {
      setLiveStatus("error");
    }
  },[]);

  useEffect(()=>{
    refreshScores();
    const interval=setInterval(refreshScores,20000);
    return()=>clearInterval(interval);
  },[refreshScores]);

  useEffect(()=>{ const t=setInterval(()=>setTick(x=>x+1),20000); return()=>clearInterval(t); },[]);

  const handleGetSummary = useCallback(async(match)=>{
    if(loadingId) return;
    setLoadingId(match.id);
    try {
      const liveData=liveScores[match.id]||null;
      const data=await fetchMatchSummary(match,liveData);
      setSummaries(p=>({...p,[match.id]:data||{found:false}}));
    } catch(e) {
      setSummaries(p=>({...p,[match.id]:{found:false}}));
    }
    setLoadingId(null);
    setLastSync(new Date());
  },[loadingId,liveScores]);

  const handleAutoLoad = async()=>{
    if(loadingId||autoLoad) return;
    setAutoLoad(true);
    const todo=MATCHES.filter(m=>isPlayed(m)&&!summaries[m.id]).slice(0,3);
    for(const m of todo) await handleGetSummary(m);
    setAutoLoad(false);
  };

  const filtered=MATCHES.filter(m=>{
    if(filter==="played"   &&!isPlayed(m)) return false;
    if(filter==="coming"   &&(isPlayed(m)||isToday(m))) return false;
    if(filter==="groupes"  &&!m.group) return false;
    if(filter==="knockout" &&!m.phase) return false;
    if(filter==="france"   &&!m.france) return false;
    if(groupF&&m.group!==groupF) return false;
    return true;
  });

  const byDate=filtered.reduce((a,m)=>{ if(!a[m.date])a[m.date]=[]; a[m.date].push(m); return a; },{});
  const playedCount=MATCHES.filter(isPlayed).length;
  const summaryCount=Object.values(summaries).filter(s=>s&&s.found!==false).length;

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#080c18 0%,#0d1b3e 55%,#08101e 100%)",fontFamily:"Georgia,'Times New Roman',serif",color:"#e8e0d0"}}>
      <div style={{position:"relative",zIndex:1,borderBottom:"1px solid rgba(200,160,32,.22)",background:"linear-gradient(180deg,rgba(200,160,20,.13) 0%,transparent 100%)",padding:"20px 16px 14px"}}>
        <div style={{maxWidth:860,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontSize:10,letterSpacing:5,color:"#c8a020",textTransform:"uppercase",marginBottom:3}}>FIFA World Cup™ 2026</div>
              <h1 style={{fontSize:"clamp(24px,6vw,52px)",fontWeight:900,margin:0,letterSpacing:-1,background:"linear-gradient(135deg,#f5d060,#c8a020,#f5d060,#a07010)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
                AO World Cup 26
              </h1>
              <div style={{fontSize:11,color:"#64748b",letterSpacing:2,marginTop:3}}>SUIVI LIVE · RÉSUMÉS IA · 104 MATCHS</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
              <LiveBadge/>
              <div style={{fontSize:10,color:"#475569"}}>🔄 {lastSync.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:10,marginTop:12,flexWrap:"wrap",alignItems:"center"}}>
            {[{v:MATCHES.length,l:"Matchs"},{v:playedCount,l:"Joués",c:"#4ade80"},{v:MATCHES.length-playedCount,l:"À venir",c:"#60a5fa"},{v:summaryCount,l:"Résumés IA",c:"#f5d060"}].map(s=>(
              <div key={s.l} style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8,padding:"5px 11px",textAlign:"center"}}>
                <div style={{fontSize:18,fontWeight:900,color:s.c||"#e2e8f0"}}>{s.v}</div>
                <div style={{fontSize:10,color:"#64748b",letterSpacing:1,textTransform:"uppercase"}}>{s.l}</div>
              </div>
            ))}
            <div style={{fontSize:11,color:liveStatus==="ok"?"#4ade80":liveStatus==="error"?"#f87171":"#64748b",display:"flex",alignItems:"center",gap:4}}>
              {liveStatus==="ok"?<>🟢 Scores live</>:liveStatus==="error"?<>🔴 Scores indispo</>:<>⏳ Chargement…</>}
            </div> 
           <button onClick={refreshScores} style={{background:"rgba(96,165,250,.12)",border:"1px solid rgba(96,165,250,.3)",borderRadius:8,padding:"5px 12px",color:"#60a5fa",fontSize:11,display:"flex",alignItems:"center",gap:5}}>🔄 Actualiser</button>           
            {playedCount>0&&(
              <button onClick={handleAutoLoad} disabled={!!loadingId||autoLoad} style={{background:"rgba(200,160,32,.12)",border:"1px solid rgba(200,160,32,.3)",borderRadius:8,padding:"5px 12px",color:"#f5d060",fontSize:11,display:"flex",alignItems:"center",gap:5}}>
                {autoLoad?<><span style={{animation:"spin 1s linear infinite"}}>⏳</span>Chargement…</>:<>✨ Résumés auto (3)</>}
              </button>
            )}
          </div>
        </div>
      </div><div style={{position:"relative",zIndex:1,padding:"12px 16px 0",maxWidth:860,margin:"0 auto"}}>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
          {FILTERS.map(fi=>(
            <button key={fi.id} onClick={()=>setFilter(fi.id)} style={{padding:"6px 13px",borderRadius:20,border:"1px solid",borderColor:filter===fi.id?"#c8a020":"rgba(255,255,255,.1)",background:filter===fi.id?"rgba(200,160,32,.2)":"transparent",color:filter===fi.id?"#f5d060":"#94a3b8",fontSize:12,fontWeight:filter===fi.id?700:400}}>
              {fi.label}
            </button>
          ))}
        </div>
        {filter!=="knockout"&&(
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:14}}>
            <button onClick={()=>setGroupF(null)} style={{padding:"3px 9px",borderRadius:14,border:"1px solid",borderColor:!groupF?"#c8a020":"rgba(255,255,255,.07)",background:!groupF?"rgba(200,160,32,.15)":"transparent",color:!groupF?"#f5d060":"#64748b",fontSize:11}}>Tous gr.</button>
            {GROUPS.map(g=>(
              <button key={g} onClick={()=>setGroupF(g===groupF?null:g)} style={{padding:"3px 8px",borderRadius:14,border:"1px solid",borderColor:groupF===g?"#c8a020":"rgba(255,255,255,.07)",background:groupF===g?"rgba(200,160,32,.15)":"transparent",color:groupF===g?"#f5d060":g==="I"?"#93c5fd":"#64748b",fontSize:11}}>Gr. {g}</button>
            ))}
          </div>
        )}
      </div>
      <div style={{position:"relative",zIndex:1,padding:"0 16px 40px",maxWidth:860,margin:"0 auto"}}>
        {Object.entries(byDate).map(([date,matches])=>(
          <div key={date} style={{marginBottom:22}}>
            <div style={{fontSize:12,fontWeight:700,letterSpacing:2,color:"#c8a020",textTransform:"uppercase",borderBottom:"1px solid rgba(200,160,32,.18)",paddingBottom:5,marginBottom:10,display:"flex",justifyContent:"space-between"}}>
              <span>{date}</span>
              <span style={{fontWeight:400,color:"#64748b",fontSize:11}}>{matches.length} match{matches.length>1?"s":""}{matches.some(isPlayed)?` · ${matches.filter(isPlayed).length} terminé${matches.filter(isPlayed).length>1?"s":""}`:""}</span>
            </div>
            {matches.map(m=><MatchCard key={m.id} match={m} onGetSummary={handleGetSummary} summaryData={summaries[m.id]} loadingId={loadingId} liveScore={liveScores[m.id]}/>)}
          </div>
        ))}
        {filtered.length===0&&<div style={{textAlign:"center",padding:"60px 20px",color:"#64748b"}}>Aucun match pour ce filtre</div>}
      </div>
      <div style={{position:"relative",zIndex:1,textAlign:"center",padding:"0 16px 28px",color:"#1e293b",fontSize:11}}>
        AO World Cup 26 · 104 matchs · Scores live · Résumés IA · CDM 2026 · Horaires CEST UTC+2
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
